[project]
name = "randompy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "black>=26.3.1",
  "cachetools>=7.0.5",
  "cachetools-async>=0.0.5",
  "fastapi[standard]>=0.135.1",
  "httpx>=0.28.1",
  "isort>=8.0.1",
  "langchain>=1.2.12",
  "langchain-core>=1.2.19",
  "langchain-openai>=1.1.11",
  "load-dotenv>=0.1.0",
  "pydantic>=2.12.5",
  "python-json-logger>=4.0.0",
  "uvicorn>=0.41.0",
]

[tool]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[dependency-groups]
dev = ["pyrefly>=0.56.0"]
